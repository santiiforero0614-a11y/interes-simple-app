<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Interés Simple</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text);
        }

        .formula-badge {
            display: inline-block;
            background-color: #eff6ff;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border: 1px solid #bfdbfe;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.calc-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        button.calc-btn:hover {
            background-color: var(--primary-hover);
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
            font-weight: 500;
        }

        .result-box {
            margin-top: 22px;
            padding: 16px;
            border-radius: 8px;
            background-color: #f8fafc;
            border: 1px solid var(--border);
            display: none;
        }

        .result-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #16a34a;
        }

        .result-detail {
            margin-top: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de Interés Simple</h2>
    <div class="formula-badge">Fórmula: I = C × r × t</div>

    <div class="form-group">
        <label for="capital">Capital Inicial ($):</label>
        <input type="number" id="capital" placeholder="Ej. 1000" step="0.01" min="0">
    </div>

    <div class="form-group">
        <label for="tasa">Tasa de Interés Anual (%):</label>
        <input type="number" id="tasa" placeholder="Ej. 5" step="0.01" min="0">
    </div>

    <div class="form-group">
        <label for="tiempo">Tiempo (en años):</label>
        <input type="number" id="tiempo" placeholder="Ej. 2" step="0.1" min="0">
    </div>

    <button type="button" class="calc-btn" onclick="calcularInteres()">Calcular Interés</button>
    
    <div id="error-msg" class="error-msg">Por favor, ingresa valores numéricos válidos mayores o iguales a cero.</div>

    <div id="resultado-interes" class="result-box">
        <div class="result-title">Interés Generado:</div>
        <div class="result-value" id="valor-interes">$0.00</div>
        <div class="result-detail" id="monto-total"></div>
    </div>
</div>

<script>
    function calcularInteres() {
        const capital = parseFloat(document.getElementById('capital').value);
        const tasa = parseFloat(document.getElementById('tasa').value);
        const tiempo = parseFloat(document.getElementById('tiempo').value);
        const box = document.getElementById('resultado-interes');
        const errorMsg = document.getElementById('error-msg');

        if (isNaN(capital) || isNaN(tasa) || isNaN(tiempo) || capital < 0 || tasa < 0 || tiempo < 0) {
            box.style.display = 'none';
            errorMsg.style.display = 'block';
            return;
        }

        errorMsg.style.display = 'none';
        const interes = capital * (tasa / 100) * tiempo;
        const total = capital + interes;

        document.getElementById('valor-interes').textContent = `$${interes.toFixed(2)}`;
        document.getElementById('monto-total').textContent = `Monto Total Final (Capital + Interés): $${total.toFixed(2)}`;
        
        box.style.display = 'block';
    }
</script>

</body>
</html>
